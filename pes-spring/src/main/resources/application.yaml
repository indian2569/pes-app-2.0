app:
  validation:
    weightSumTolerance: 0.0005

# /v3/api-docs is served by OpenAPIController from openapi/pes.yaml
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  profiles:
    active: postgres, dev
  main:  
   banner-mode: off
  application:
    name: pes
  cache:
    jcache:
      config: classpath:ehcache.xml
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
      naming.implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
    properties:
      hibernate: 
        jdbc:
          batch-size: 20
        show_sql: true
        cache:
          use_second_level_cache: false

  jackson:
    serialization:
      indent-output: true
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non-empty   
  boot.admin.client.url:  ${ADMIN_SERVER_URL:}   

management:
  endpoints.web.exposure.include: "*"
  metrics.web.server.request.autotime.enabled: true


server:
  error:
    include-message: always

logging:
  level:
#    root: debug
    org.hibernate.SQL: debug
    org.hibernate.type: trace
    org.springframework.cache: trace
    org.springframework.security: debug
    sk.kaspian.pes: debug

bezkoder:
  app:
    # base64-encoded, must decode to >= 64 bytes for HS512
    jwtSecret: ${JWT_SECRET:XlIr8FM8mo7PpHTHGRwdKgbYCkRMQoOu2p49KbOqHhSo3AWT5RmwMHTl36xHlb7EzCAjG2OHY2AjOihxtBo+yw==}
    jwtExpirationMs: 1800000
