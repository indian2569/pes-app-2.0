components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    authSessionToken:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: Include the `X-Auth-Token` header for session identification.
  parameters:
    PageSize:
      name: page_size
      in: query
      description: Number of items in a page, default page size is `20`
      x-pageable: true
      x-default-value: 20
      schema:
        type: integer
        #        minimum: 1
        #        maximum: 100
        default: 20
      required: false
    PageNumber:
      name: page_number
      in: query
      x-pageable-option: true
      description: Page number, default is `0`
      schema:
        type: integer
        default: 0
#        minimum: 0
      required: false
    Sort:
      name: sort
      in: query
      x-pageable-option: true
      description: |
        "Multi sort criteria: property1,property2(desc),property(asc) eg. name,type(desc)"        
      schema:
        type: string
      required: false
    Search:
      name: search
      in: query
      x-pageable-option: true
      description: "Search test filter criteria"        
      schema:
        type: string
      required: false
    MaxRecords:
      name: max
      in: query
      description: Max results count
      schema:
        type: integer
      required: false
    FromRecord:
      name: from
      in: query
      description: From which result to continue (inclusive)
      schema:
        type: integer
      required: false
    Name:
      name: name
      in: query
      x-pageable-option: true
      description: "Name of the card, event, etc"
      schema:
        type: string
      required: false
    Gender:
      name: gender
      in: query
      x-pageable-option: true
      description: "Gender on card object"
      schema:
        type: string
      required: false
    YearFrom:
        name: yearfrom
        in: query
        x-pageable-option: true
        description: "Year value from:"
        schema:
          type: string
        required: false
    YearTo:
      name: yearto
      in: query
      x-pageable-option: true
      description: "Year value to:"
      schema:
        type: string
      required: false
    Author:
      name: author
      in: query
      x-pageable-option: true
      required: false
      description: "Identification of peason who created object"
      schema:
        type: string
    Place:
      name: place
      in: query
      x-pageable-option: true
      required: false
      description: "Identification of place"
      schema:
        type: string
    Campaign:
      name: campaign
      in: query
      x-pageable-option: true
      required: false
      description: "Identification of campaign"
      schema:
        type: string
    Program:
      name: program
      in: query
      x-pageable-option: true
      required: false
      description: "Identification of program"
      schema:
        type: string
  responses:
    EntityNotFound:
      description: "Entity not found"
    BadGatewayException:
      description: "Target processable service unreachable"
    SystemException:
      description: "A system error occurred in the service call"
    InvalidRequest:
      description: "The request does not match the specification"
    URLNotExist:
      description: "Given URL does not exist"
    UnauthorizedError:
      description: "Access token is missing or invalid"
    AccessDenied:
      description: "Access denied - insufficient rights"
  schemas:
    CardPage:
      type: object
      description: "Array of card results filtered, ordered and with paging support"
      required:
        - results
        - paging
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Card'
        paging:
          $ref: '#/components/schemas/Paging'
    Card:
      description: "Card object"
      type: object
      properties:
        id: 
          type: number
        client_nick:
          type: string
        client_gender:
          type: string
        client_anamnesis:
          type: string
        client_dev_plan:
          type: string
        clint_age:
          type: string
        client_birth_year:
          type: string
        client_name:
          type: string
        client_surname:
          type: string
        client_birth_date:
          type: string
        client_family_status:
          type: string
        client_citizenship:
          type: string
        client_address:
          type: string
        client_phone:
          type: string
        client_email:
          type: string
        client_socnet:
          type: string
        client_health:
          type: string
        client_income:
          type: string
        client_belongings:
          type: string
        client_other_institutes:
          $ref: '#/components/schemas/Institution'
        createdBy:
          $ref: '#/components/schemas/User'
        status:
          type: string
        created:
          type: string
        updated:
          type: string
        last_change:
          $ref: '#/components/schemas/User'
    PersonFilterRequest:
      type: object
      description: Filter criteria for searching cards
      properties:
        name:
          type: string
          example: Jano

        sex:
          type: string
          description: Sex of person
          enum: [ MAN, WOMAN ]

        timeFrom:
          type: string
          format: date
          description: Birth date from (inclusive)
          example: 1980-01-01

        timeTo:
          type: string
          format: date
          description: Birth date to (inclusive)
          example: 1995-12-31

        active:
          type: boolean
          description: Active status

        createdBy:
          type: string
          example: admin

        sortBy:
          type: string
          description: Field to sort by
          enum:
            - name
            - birthDate
            - active
            - createdBy
          example: name

        sortOrder:
          type: string
          description: Sort direction
          enum: [ ASC, DESC ]
          example: ASC
    Entry:
      description: "Entry object"
      type: object
      properties:
        id: 
          type: number
        client:
          type: array
          items:
            $ref: '#/components/schemas/Card'
        clients_on_site:
          type: array
          items:
            $ref: '#/components/schemas/Card'
        entry_date_from:
          type: string
        entry_date_to:
          type: string
        place:
          type: string
        contact_type:
          type: string
        campaign:
          $ref: '#/components/schemas/Campaign'
        program_type:
          $ref: '#/components/schemas/Program'
        work_methods:
          type: array
          items:
            $ref: '#/components/schemas/Method'
        other_workers:
          type: array
          items:
            $ref: '#/components/schemas/Coworker'
        event_description:
          type: string
        fast_message:
          type: string
        createdBy:
          $ref: '#/components/schemas/User'
        created:
          type: string
        updated:
          type: string
        last_change:
          $ref: '#/components/schemas/User'
    Event:
      description: "Event object"
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        active:
          type: boolean
        createdBy:
          $ref: '#/components/schemas/User'
        created:
          type: string
        updated:
          type: string
        last_change:
          $ref: '#/components/schemas/User'
    Campaign:
      description: "Campaign object"
      type: object
