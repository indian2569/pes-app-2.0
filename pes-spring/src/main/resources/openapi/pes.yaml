        updated:
          type: string
        last_change:
          $ref: '#/components/schemas/User'
    Institution:
      description: "Institution object"
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        active:
          type: boolean
        createdBy:
          $ref: '#/components/schemas/User'
        created:
          type: string
        updated:
          type: string
        last_change:
          $ref: '#/components/schemas/User'
    Method:
      description: "Methods object"
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        active:
          type: boolean
        createdBy:
          $ref: '#/components/schemas/User'
        created:
          type: string
        updated:
          type: string
        last_change:
          $ref: '#/components/schemas/User'
    Program:
      description: "Programs object"
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        active:
          type: boolean
        createdBy:
          $ref: '#/components/schemas/User'
        created:
          type: string
        updated:
          type: string
        last_change:
          $ref: '#/components/schemas/User'
    LoginRequest:
      description: "Login object"
      type: object
      properties:
        username: 
          type: string
        password:
          type: string
    SignUpRequest:
      description: "Login object"
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
        roles:
          type: array
          items:
            type: string
    LogUser:
      description: "Programs object"
      type: object
      properties:
        jwt: 
          type: string
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        roles:
          type: array
          items: 
            type: string
    MessageResponse:
      description: "user registration response"
      type: object
      properties: 
        message: 
          type: string
    JwtResponse:
      type: object
      properties:
        token:
          type: string
          description: Access token string.
        id:
          type: number
          description: User ID.
        username:
          type: string
          description: Username of the authenticated user.
        email:
          type: string
          description: Email of the authenticated user.
        roles:
          type: array
          items:
            type: string
          description: List of roles assigned to the authenticated user.
    SessionInfo:
      type: object
      properties:
        id:
          type: string
          description: Unique identity identificator
        created:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
    User:
      type: object
      properties:
        id:
          type: number
          description: User ID.
        username:
          type: string
          description: Username of the authenticated user.
    Paging:
      type: object
      description: "Paging information"
      required:
        - pageNumber
        - pageSize
        - pageCount
        - totalElements
      properties:
        pageNumber:
          type: integer
          format: int32
          description: "Page number, first page is 0"
        pageSize:
          type: integer
          format: int32
          description: "Number of items in the page"
        pageCount:
          type: integer
          format: int32
          description: "Total number of pages"
        totalElements:
          type: integer
