<div class="container" *ngIf="currentUser; else loggedOut">
  <header class="jumbotron">
    <h3>
       Prihlasení ako používateľ: <strong>{{ currentUser.username }}</strong>
    </h3>
  </header>
  <p *ngIf="currentUser.token">
    <strong>Token:</strong>
    {{ currentUser.token.substring(0, 20) }} ...
    {{ currentUser.token.substring(currentUser.token.length - 20) }}
  </p>
  <p>
    <strong>Email:</strong>
    {{ currentUser.email }}
  </p>
  <strong>Aktuálne ma užívateľ priradené tieto role:</strong>
  <ul>
    <li *ngFor="let role of currentUser.roles">
      {{ role }}
    </li>
  </ul>
</div>

<ng-template #loggedOut>
  Prosím prihláste sa do aplikácie.
</ng-template>
