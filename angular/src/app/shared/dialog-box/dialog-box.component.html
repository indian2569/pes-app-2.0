<h1 mat-dialog-title>
  {{ action === 'Delete' ? 'Vymazanie záznamu' : descriptionText }}
</h1>

<div mat-dialog-content>

  <!-- EDIT / CREATE -->
  <form
      *ngIf="action !== 'Delete'; else deleteTemplate"
      [formGroup]="reportForm"
      class="dialog-form">

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Názov</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Popis</mat-label>
      <textarea
          matInput
          formControlName="description"
          rows="6"
          maxlength="1500">
      </textarea>
      <mat-hint align="end">
        {{ reportForm.get('description')?.value?.length || 0 }}/1500
      </mat-hint>
    </mat-form-field>

    <mat-form-field
        *ngIf="actionType === 5"
        appearance="fill"
        class="full-width">

      <mat-label>Pozícia</mat-label>
      <input matInput formControlName="position" />
    </mat-form-field>

  </form>

  <!-- DELETE -->
  <ng-template #deleteTemplate>
    <div class="delete-warning">
      <mat-icon color="warn" class="delete-icon">warning</mat-icon>

      <p class="delete-text">
        Naozaj chceš vymazať tento objekt
      </p>

      <p class="delete-name">
        <strong>{{ data.name }}</strong>
      </p>

      <p class="delete-hint">
        Táto akcia je nevratná.
      </p>
    </div>
  </ng-template>

</div>

<div mat-dialog-actions align="end">
  <button
      mat-stroked-button
      (click)="closeDialog()">
    Zrušiť
  </button>

  <button
      mat-raised-button
      [color]="action === 'Delete' ? 'warn' : 'primary'"
      (click)="doAction()">

    {{ buttonText }}
  </button>
</div>
