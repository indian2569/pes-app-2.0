<div class="table-container">

  <!-- Add button -->
  <div class="table-header" *ngIf="addButton">
    <h2>Záznamy</h2>
    <button mat-flat-button color="primary" (click)="openDialog('Add', {})">
      Pridať
    </button>
  </div>

  <!-- Table -->
  <table mat-table [dataSource]="tableData" class="mat-elevation-z8" matSort>

    <!-- Place Column -->
    <ng-container matColumnDef="place">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Miesto</th>
      <td mat-cell *matCellDef="let element">{{ element.place }}</td>
    </ng-container>

    <!-- Date Column -->
    <ng-container matColumnDef="entry_date_from">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Dátum</th>
      <td mat-cell *matCellDef="let element">{{ element.entry_date_from | date }}</td>
    </ng-container>

    <!-- Campaign Column -->
    <ng-container matColumnDef="campaign">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Kampaň</th>
      <td mat-cell *matCellDef="let element">{{ element.campaign?.name }}</td>
    </ng-container>

    <!-- Program Column -->
    <ng-container matColumnDef="program_type">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Program</th>
      <td mat-cell *matCellDef="let element">{{ element.program_type?.name }}</td>
    </ng-container>

    <!-- Created By Column -->
    <ng-container matColumnDef="createdBy">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Pridal</th>
      <td mat-cell *matCellDef="let element">{{ element.createdBy?.username }}</td>
    </ng-container>

    <!-- Action Column -->
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Akcie</th>
      <td mat-cell *matCellDef="let element" class="action-cell">
        <button mat-icon-button color="primary" matTooltip="Upraviť" (click)="redirectUrl(element)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" matTooltip="Vymazať" (click)="openDialog('Delete', element)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- Header & Row -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
