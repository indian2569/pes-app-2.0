<div class="table-wrapper">

  <!-- Table title and Add button -->
  <div class="table-header">
    <h3 class="page-title full">Karty</h3>
    <button mat-flat-button color="primary" class="btn-add" (click)="redirectUrl({id: 0})">
      Pridať
    </button>
  </div>

  <!-- Table -->
  <table mat-table [dataSource]="tableData" class="mat-elevation-z8 my-table" matSort>

    <!-- Name Column -->
    <ng-container matColumnDef="client_nick">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Meno </th>
      <td mat-cell *matCellDef="let element"> {{element.client_nick}} </td>
    </ng-container>

    <!-- Gender Column -->
    <ng-container matColumnDef="client_gender">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Pohlavie </th>
      <td mat-cell *matCellDef="let element"> {{element.client_gender}} </td>
    </ng-container>

    <!-- Age Column -->
    <ng-container matColumnDef="clint_age">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Vek </th>
      <td mat-cell *matCellDef="let element"> {{element.clint_age}} </td>
    </ng-container>

    <!-- Birth Year Column -->
    <ng-container matColumnDef="client_birth_year">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Rok narodenia </th>
      <td mat-cell *matCellDef="let element"> {{element.client_birth_year}} </td>
    </ng-container>

    <!-- Created By Column -->
    <ng-container matColumnDef="cratedBy">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Pridal </th>
      <td mat-cell *matCellDef="let element"> {{element.createdBy.username}} </td>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
      <td mat-cell *matCellDef="let element">
        <span [class.active]="element.status === 'true'" [class.inactive]="element.status !== 'true'">
          {{ element.status === "true" ? "Aktívny" : "Neaktívny" }}
        </span>
      </td>
    </ng-container>

    <!-- Action Column -->
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef> Akcie </th>
      <td mat-cell *matCellDef="let element" class="action-cell">
        <button mat-icon-button color="primary" (click)="redirectUrl(element)" matTooltip="Upraviť">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="activateTogle(element)" matTooltip="Aktivovať / Deaktivovať">
          <mat-icon>toggle_off</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="openDialog('Delete', element)" matTooltip="Vymazať">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>
  <mat-paginator (page)="handlePageEvent($event)" [length]="pageble.totalElements" [pageIndex]="pageble.pageNumber" [pageSize]="pageble.pageSize" [pageSizeOptions]="[10, 20, 50]" aria-label="Vyber pocet zaznamov">
  </mat-paginator>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>
