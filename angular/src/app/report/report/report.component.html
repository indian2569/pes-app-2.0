<div class="stats-card">
  <h3 class="page-title">Štatistiky</h3>

  <!-- TODO: remove this notice once statistics are implemented -->
  <p class="todo-notice" *ngIf="notImplemented">
    Štatistiky zatiaľ nie sú implementované. Táto funkcionalita bude dostupná v ďalšej verzii.
  </p>

  <form [formGroup]="statForm" (ngSubmit)="onSubmit()">

    <!-- Date Range -->
    <div class="date-row">
      <mat-form-field appearance="outline" class="date-field">
        <mat-label>Za obdobie od</mat-label>
        <input matInput [matDatepicker]="fromPicker" formControlName="dateFrom" required>
        <mat-datepicker-toggle matSuffix [for]="fromPicker"></mat-datepicker-toggle>
        <mat-datepicker #fromPicker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline" class="date-field">
        <mat-label>do</mat-label>
        <input matInput [matDatepicker]="toPicker" formControlName="dateTo" required>
        <mat-datepicker-toggle matSuffix [for]="toPicker"></mat-datepicker-toggle>
        <mat-datepicker #toPicker></mat-datepicker>
      </mat-form-field>
    </div>

    <!-- Stat Type -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Typ štatistiky</mat-label>
      <mat-select formControlName="statType" required>
        <mat-option value="stat-specific-kaspian">Kaspian špecifická štatistika</mat-option>
        <mat-option value="stat-bsk">Štatistika pre BSK - aktuálny rok</mat-option>
        <mat-option value="stat-bsk-past">Štatistika pre BSK - predošlé roky</mat-option>
        <mat-option value="stat-export">Export štatistiky</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Submit Button -->
    <div class="form-actions">
      <button mat-flat-button color="primary" type="submit" [disabled]="notImplemented">
        Zobraziť
      </button>
      <img src="/images/spinner-sb.gif" *ngIf="loading" class="loading-spinner">
    </div>

  </form>
</div>
