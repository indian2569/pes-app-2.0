<form [formGroup]="filterForm" class="filter-panel" (ngSubmit)="applyFilters()">

  <div class="filter-row">

    <!-- Meno -->
    <mat-form-field appearance="outline">
      <mat-label>Meno</mat-label>
      <input matInput formControlName="name">
    </mat-form-field>

    <!-- Pohlavie (hodnoty musia sedieť s kartou klienta) -->
    <mat-form-field appearance="outline">
      <mat-label>Pohlavie</mat-label>
      <mat-select formControlName="gender">
        <mat-option value="">All</mat-option>
        <mat-option value="man">Mužské</mat-option>
        <mat-option value="woman">Ženské</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Rok narodenia od -->
    <mat-form-field appearance="outline">
      <mat-label>Rok narodenia od</mat-label>
      <input matInput type="number" min="1900" max="2100" formControlName="yearFrom">
    </mat-form-field>

    <!-- Rok narodenia do -->
    <mat-form-field appearance="outline">
      <mat-label>Rok narodenia do</mat-label>
      <input matInput type="number" min="1900" max="2100" formControlName="yearTo">
    </mat-form-field>

    <!-- Pridal (používateľské meno autora karty) -->
    <mat-form-field appearance="outline">
      <mat-label>Pridal (používateľ)</mat-label>
      <input matInput formControlName="author">
    </mat-form-field>

    <!-- Sort by -->
    <mat-form-field appearance="outline">
      <mat-label>Zoradiť podľa</mat-label>
      <mat-select formControlName="sortBy">
        <mat-option value="clientNick">Meno</mat-option>
        <mat-option value="clientBirthYear">Rok narodenia</mat-option>
        <mat-option value="status">Status</mat-option>
        <mat-option value="createdBy.username">Pridal</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Sort order -->
    <mat-form-field appearance="outline">
      <mat-label>Poradie</mat-label>
      <mat-select formControlName="sortOrder">
        <mat-option value="ASC">ASC</mat-option>
        <mat-option value="DESC">DESC</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <!-- Actions -->
  <div class="filter-actions">
    <button mat-flat-button color="primary" type="submit">
      Apply
    </button>

    <button mat-stroked-button type="button" (click)="resetFilters()">
      Reset
    </button>
  </div>

</form>

<app-table-card *ngIf="cardData"
[tableData] = "cardData.results" [pageble] = "cardData.paging" (pageChange)="onPageChange($event)"></app-table-card>
