<div class="login-container">
  <mat-card class="login-card">
    <div class="avatar-container">
      <img mat-card-avatar src="//ssl.gstatic.com/accounts/ui/avatar_2x.png" alt="Avatar">
    </div>

    <!-- Login Form -->
    <form *ngIf="!isLoggedIn" #f="ngForm" (ngSubmit)="f.valid && onSubmit()" novalidate>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Uživateľské meno</mat-label>
        <input matInput name="username" [(ngModel)]="form.username" required #username="ngModel">
        <mat-error *ngIf="username.errors && f.submitted">
          Uživateľské meno je povinné!
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Heslo</mat-label>
        <input matInput type="password" name="password" [(ngModel)]="form.password" required minlength="6" #password="ngModel">
        <mat-error *ngIf="password.errors && f.submitted">
          <span *ngIf="password.errors.required">Heslo je povinné</span>
          <span *ngIf="password.errors.minlength">Heslo musí mať aspoň 6 znakov</span>
        </mat-error>
      </mat-form-field>

      <div class="login-error" *ngIf="f.submitted && isLoginFailed">
        <mat-error>Prihlasovacia chyba: {{ errorMessage }}</mat-error>
      </div>

      <button mat-flat-button color="primary" class="full-width" type="submit" [disabled]="loading">
        <mat-progress-spinner
            *ngIf="loading"
            diameter="20"
            mode="indeterminate"
            color="accent"
        ></mat-progress-spinner>
        <span *ngIf="!loading">Prihlásiť</span>
      </button>
    </form>

    <!-- Logged In Message -->
    <div *ngIf="isLoggedIn" class="login-success">
      <mat-icon color="primary">check_circle</mat-icon>
      <p>
        Uspešne ste prihlásení ako užívateľ: <strong>{{ user }}</strong>
        s rolami: <strong>{{ roles.join(', ') }}</strong>.
      </p>
      <button mat-flat-button (click)="runHome()">Domáca obrazovka</button>
    </div>

  </mat-card>
</div>
