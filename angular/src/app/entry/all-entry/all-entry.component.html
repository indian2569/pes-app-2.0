<form [formGroup]="filterForm" class="filter-panel" (ngSubmit)="applyFilters()">

  <div class="filter-row">

    <!-- Place -->
    <mat-form-field appearance="outline">
      <mat-label>Miesto</mat-label>
      <input matInput formControlName="place">
    </mat-form-field>

    <!-- Time from -->
    <mat-form-field appearance="outline">
      <mat-label>Datum od:</mat-label>
      <input matInput [matDatepicker]="fromPicker"
             formControlName="timeFrom">
      <mat-datepicker-toggle matSuffix [for]="fromPicker"></mat-datepicker-toggle>
      <mat-datepicker #fromPicker></mat-datepicker>
    </mat-form-field>

    <!-- Time to -->
    <mat-form-field appearance="outline">
      <mat-label>Datum do:</mat-label>
      <input matInput [matDatepicker]="toPicker"
             formControlName="timeTo">
      <mat-datepicker-toggle matSuffix [for]="toPicker"></mat-datepicker-toggle>
      <mat-datepicker #toPicker></mat-datepicker>
    </mat-form-field>

    <!-- Campaign -->
    <mat-form-field appearance="outline">
      <mat-label>Kampaň</mat-label>
      <mat-select formControlName="campaign">
        <mat-option value="">All</mat-option>
        <mat-option *ngFor="let c of campaigns$ | async" [value]="c.name">
          {{ c.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Program -->
    <mat-form-field appearance="outline">
      <mat-label>Program</mat-label>
      <mat-select formControlName="program">
        <mat-option value="">All</mat-option>
        <mat-option *ngFor="let p of programs$ | async" [value]="p.name">
          {{ p.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Created by (používateľské meno autora záznamu) -->
    <mat-form-field appearance="outline">
      <mat-label>Pridal</mat-label>
      <input matInput formControlName="author">
    </mat-form-field>

    <!-- Sort by -->
    <mat-form-field appearance="outline">
      <mat-label>Zoradiť podľa:</mat-label>
      <mat-select formControlName="sortBy">
        <mat-option value="entryDateFrom">Datum</mat-option>
        <mat-option value="place">Miesto</mat-option>
        <mat-option value="campaign.name">Kampaň</mat-option>
        <mat-option value="programType.name">Program</mat-option>
        <mat-option value="createdBy.username">Pridal</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Sort order -->
    <mat-form-field appearance="outline">
      <mat-label>Poradie</mat-label>
      <mat-select formControlName="sortOrder">
        <mat-option value="ASC">ASC</mat-option>
        <mat-option value="DESC">DESC</mat-option>
      </mat-select>
    </mat-form-field>

  </div>

  <!-- Actions -->
  <div class="filter-actions">
    <button mat-flat-button color="primary" type="submit">
      Apply
    </button>

    <button mat-stroked-button type="button" (click)="resetFilters()">
      Reset
    </button>
  </div>

</form>
<app-table-entry *ngIf="entryData"
[tableData] = "entryData.results" [pageble] = "entryData.paging" (pageChange)="onPageChange($event)"></app-table-entry>
